<!DOCTYPE html>
<html lang="en">
<head>
    <title>Last Over Cricket Game</title>
    <style>
        body {
            background-color: #5ad3a5;
            color: rgb(0, 0, 0);
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: rgb(78, 66, 2);
            margin-top: 40px;
        }
    </style>>
</head>
<body>
    <h1>🏏 Last Over</h1>
    <p>Score 12 runs in 6 balls!</p>
    
<div class="scoreboard">

    <div>
        <h3>Runs</h3>
        <p id="runs">0</p>
    </div>

    <div>
        <h3>Needed</h3>
        <p id="needed">12</p>
    </div>

    <div>
        <h3>Balls Left</h3>
        <p id="balls">6</p>
    </div>

    <div>
        <h3>Wickets</h3>
        <p id="wickets">0</p>
    </div>

</div>

</body>

</html>
