<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container{
            
            display: flex;
            
            flex-direction: row;
            outline: 4px solid rgb(0, 0, 0);
            align-items: center;
            flex-wrap: wrap;
        }
        .container>div{
            color:aliceblue;
            width: 150px;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1{
            background-color: rgb(66, 255, 198);
        }
        #box2{
            
            background-color: rgb(64, 54, 156);
            
        }
        #box3{
            background-color: rgb(177, 31, 162);
            
            
        }
        #box4{
            background-color: rgb(208, 247, 101);
        }
        #box5{
            background-color: rgb(22, 158, 43);
        }
        #box6{
            background-color: rgb(208, 59, 21);
        }
        #box7{
            background-color: rgb(190, 19, 19);
        }
        #box8{
            background-color: rgb(166, 130, 14);
        }
        #box9{
            background-color: rgb(66, 255, 198);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
        <div id="box4">Box 4</div>
        <div id="box5">Box 5</div>
        <div id="box6">Box 6</div>
        <div id="box7">Box 7</div>
        <div id="box8">Box 8</div>
        <div id="box9">Box 9</div>
    </div>
</body>
</html>
