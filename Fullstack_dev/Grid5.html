<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color: grey;
            --text-size: 30px;
        }

        .container {
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            outline: 1px solid black;
            grid-template-rows: repeat(8, 1fr);
        }

        .container>div {
            font-size: var(--text-size);
            outline: 1px solid black;
        }

        .parent {
            --primary-color: grey;
            display: grid;
            /*now the parent box is in grid form*/
            background-color: blueviolet;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/9;
            /*column will be from 1 to 7. 8th column not included.*/
            grid-row: 1/9;
            /*row will be from 1 to 5. 6th row not included.*/
        }

        .child1 {
            background-color: var(--primary-color);
            color: white;
            grid-column: 2/9;
            grid-row: 2/9;
            text-align: center;
            
        }

        
        
        .child2 {
            background-color: pink;
            color: white;
            grid-column: 3/9;
            grid-row: 3/9;
            text-align: center;
        }
        .child3 {
            background-color: lightblue;
            color: white;
            grid-column: 4/9;
            grid-row: 4/9;
            text-align: center;
        }
        .child4 {
            background-color: lightgreen;
            color: white;
            grid-column: 5/9;
            grid-row: 5/9;
            text-align: center;
        }
        .child5 {
            background-color: rgb(166, 0, 28);
            color: white;
            grid-column: 6/9;
            grid-row: 6/9;
            text-align: center;
        }
        .child6 {
            background-color: rgb(68, 8, 18);
            color: white;
            grid-column: 6/9;
            grid-row: 6/9;
            text-align: center;
        }
        .child7 {
            background-color: rgb(153, 72, 86);
            color: white;
            grid-column: 7/9;
            grid-row: 7/9;
            text-align: center;
        }
        .child8 {
            background-color: rgb(166, 0, 28);
            color: white;
            grid-column: 8/9;
            grid-row: 8/9;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="parent">
            <div class="child1">
                1
            </div>
            <div class="child2">
                2
                </div>
            <div class="child3">
                3
            </div>
            <div class="child4">
                4
            </div>
            <div class="child5">
                5
            </div>
            <div class="child6">
                6
            </div>
            <div class="child7">
                7
            </div>
            <div class="child8">
                8
            </div>

        </div>
    </div>
</body>

</html>
