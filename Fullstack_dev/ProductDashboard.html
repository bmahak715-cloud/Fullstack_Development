<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .container > #con1 {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 220px;
            flex-shrink: 0;
            padding: 20px;
            border-radius: 10px;
            background: #12304a;
            color: #ffffff;
        }

        .container > #con1 > ul {
            display: flex;
            gap: 10px;
            flex-direction: row;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        a {
            color: #b9e6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #con2 {
            flex: 1;
            padding: 24px;
            border-radius: 10px;
            background: #ffffff;
        }

        #con2 h1 {
            margin-top: 0;
        }

        .products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .flex {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .item {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            flex-direction: column;
            align-items: flex-start;
        }

        .item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .container > #con1 {
                width: auto;
            }

            .container > #con1 > ul {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .item {
                flex-wrap: wrap;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="" id="con1">
            <h2>Product Dashboard</h2>
            <ul>
                <li><a href="ProductPage.html">Product Page</a></li>
                <li><a href="ProductDashboard.html">Product Dashboard</a></li>
                <li><a href="image.html">Image</a></li>
            </ul>
        </div>

        <main id="con2">
            <h1>Dashboard Content</h1>
            <div class="products">
                <div class="flex item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAWONwI5srmR9wOapmr11E0sG4PuhopbtlVqsRnYGPIw&s" alt="Product Image">
                    <p>Product Name</p>
                    <p>Product Description</p>
                    <button>Add to Cart</button>
                </div>
                <div class="flex item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3IVeFtEXa6Y239do4nhBrKG2Och-YwplXioxN5alhEw&s=10" alt="Product Image">
                    <p>Product Name</p>
                    <p>Product Description</p>
                    <button>Add to Cart</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
