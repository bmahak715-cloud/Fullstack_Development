<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* @rule is used to adjuct the size meaning how much should the minimum width of screen on which media property will apply on and max width.  */
        body{
            background-color: black;
            color:lightblue
        }

        p{
            
            font-size:40px;
        }
        .parent{
            font-size:80px;
            container-type: inline-size;
            
        }


        @container (min-width: 500px) and (max-width: 1000px){
            .child{
                background-color: rgb(182, 0, 30);
            }
            p{
                font-size:80px
            }
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">
        <p>Hello World</p>
    </div>
</div>
</body>
</html>
