<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container{
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            flex-direction: row;
            outline: 4px solid rgb(0, 0, 0);
            align-items: center;
        }
        .container>div{
            color:aliceblue;
            width: 150px;
            height: 100px;
            align-content: center;
            text-align: center;
            outline: 2px solid rgb(255, 255, 255);
        }
        #box1{
            background-color: rgb(66, 255, 198);
            /*Method 1 of giving flex properties like flex-grow, flex-shrink, flex-basis*/
            flex-basis: 150px;
            flex-grow: 0;/*the box will not grow to fill the available space. However much i grow it the larger portion will always be the first box in which it is divide into 2/4*/
            flex-shrink: 0;
        }
        #box2{
            
            background-color: rgb(0, 255, 187);
            /*Method 2 of giving flex properties like flex-grow, flex-shrink, flex-basis*/
            flex-grow: 0;
            flex-shrink: 0;
        }
        #box3{
            flex-basis: 150px;
            background-color: rgb(16, 176, 131);
            flex-grow: 0;
            flex-shrink: 0;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
    </div>
</body>
</html>
